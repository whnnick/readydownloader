name: Bug report
description: Report a reproducible problem in a supported platform build.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove cookies, account tokens, private URLs, local usernames, and personal media details before submitting.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon
        - Other or unsupported
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the application
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove cookies, tokens, private URLs, usernames, and private paths.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed cookies, tokens, private URLs, account data, and personal media information.
          required: true
