name: ReadyDownloader macOS Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      NOTARY_PROFILE: ReadyDownloader-notary
      KEYCHAIN_PASSWORD: temporary-ci-keychain-password
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release metadata
        run: ./script/check_release_consistency.sh "$GITHUB_REF_NAME"

      - name: Scan repository
        run: ./script/scan_repository.sh

      - name: Select release trust mode
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          configured=0
          for value in \
            "$CERTIFICATE" \
            "$CERTIFICATE_PASSWORD" \
            "$SIGNING_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"; do
            if test -n "$value"; then
              configured=$((configured + 1))
            fi
          done
          if test "$configured" -eq 0; then
            echo "RELEASE_TRUST_MODE=adhoc" >> "$GITHUB_ENV"
          elif test "$configured" -eq 6; then
            echo "RELEASE_TRUST_MODE=developer-id" >> "$GITHUB_ENV"
          else
            echo "Apple release credentials are only partially configured." >&2
            exit 1
          fi

      - name: Run Swift tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/apps/macos/.build/clang-module-cache
        run: |
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          swift test \
            --package-path apps/macos \
            --scratch-path apps/macos/.build \
            --cache-path apps/macos/.build/swiftpm-cache \
            --config-path apps/macos/.build/swiftpm-config \
            --security-path apps/macos/.build/swiftpm-security \
            --manifest-cache local \
            --disable-sandbox

      - name: Import Developer ID certificate
        if: env.RELEASE_TRUST_MODE == 'developer-id'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Configure Apple notarization
        if: env.RELEASE_TRUST_MODE == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, notarize, and package
        if: env.RELEASE_TRUST_MODE == 'developer-id'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          REQUIRE_GATEKEEPER: "1"
          ALLOW_UNAVAILABLE_VIDEOTOOLBOX: "1"
        run: ./script/package_macos.sh

      - name: Build and package ad-hoc signed release
        if: env.RELEASE_TRUST_MODE == 'adhoc'
        env:
          ALLOW_UNAVAILABLE_VIDEOTOOLBOX: "1"
        run: ./script/package_macos.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$RELEASE_TRUST_MODE" = "developer-id"; then
            TRUST_NOTE="> [!NOTE]
          > This macOS package is Developer ID signed and Apple-notarized.
          > 此 macOS 安装包已完成 Developer ID 签名和 Apple 公证。"
          else
            TRUST_NOTE="> [!WARNING]
          > This macOS package is ad-hoc signed and not Apple-notarized. macOS may require manual approval on first launch.
          > 此 macOS 安装包采用 ad-hoc 签名且未经 Apple 公证，首次启动时可能需要手动允许。"
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/release/* \
            --title "ReadyDownloader $GITHUB_REF_NAME" \
            --notes "$TRUST_NOTE" \
            --generate-notes \
            --verify-tag

      - name: Verify public release assets and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$LATEST_TAG" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 3
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-check"
          cd "$RUNNER_TEMP/release-check"
          test -s "ReadyDownloader-$VERSION-macos-arm64.zip"
          test -s "ReadyDownloader-$VERSION-macos-arm64.dmg"
          shasum -a 256 -c SHA256SUMS.txt
