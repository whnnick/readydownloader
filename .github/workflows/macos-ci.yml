name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Check release metadata
        run: ./script/check_release_consistency.sh

      - name: Check shell scripts
        run: bash -n script/*.sh

      - name: Verify macOS icon generation
        run: |
          ./script/generate_macos_icon.sh "$RUNNER_TEMP/AppIcon.icns"
          file "$RUNNER_TEMP/AppIcon.icns" | grep -F "Mac OS X icon"

      - name: Scan repository
        run: ./script/scan_repository.sh

      - name: Run Swift tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/apps/macos/.build/clang-module-cache
        run: |
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          swift test \
            --package-path apps/macos \
            --scratch-path apps/macos/.build \
            --cache-path apps/macos/.build/swiftpm-cache \
            --config-path apps/macos/.build/swiftpm-config \
            --security-path apps/macos/.build/swiftpm-security \
            --manifest-cache local \
            --disable-sandbox

  download-integration:
    if: github.event_name == 'push'
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pinned macOS tools
        run: ./script/prepare_macos_tools.sh

      - name: Verify best-quality download and audio merge
        run: ./script/test_macos_download_integration.sh
